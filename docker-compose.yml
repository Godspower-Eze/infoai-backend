services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: infoai
      POSTGRES_USER: infoai
      POSTGRES_PASSWORD: infoai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infoai -d infoai"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - infoai-postgres:/var/lib/postgresql

volumes:
  infoai-postgres:
